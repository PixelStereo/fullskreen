name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Ubuntu 24.04) + tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev libqt6opengl6-dev \
            libgl1-mesa-dev libgl1-mesa-dri libavformat-dev libavcodec-dev libswscale-dev libavutil-dev \
            ffmpeg xvfb
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
          cmake --build build --target fulskrin_tests -j4
      - name: Engine tests
        run: |
          sh test/make_media.sh
          xvfb-run -a ./build/fulskrin_tests
          xvfb-run -a ./build/fulskrin_tests --check-isf isf

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: brew install qt ffmpeg pkg-config
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
          cmake --build build -j4
      - name: Package .app
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build/Fulskrin.app
          ditto -c -k --keepParent build/Fulskrin.app Fulskrin-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Fulskrin-macos
          path: Fulskrin-macos.zip

  windows:
    name: Windows (MSVC 2022)
    runs-on: windows-2022
    env:
      FFMPEG_ZIP: ffmpeg-n8.1-latest-win64-lgpl-shared-8.1
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true
      - name: FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$env:FFMPEG_ZIP.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath C:\ffmpeg
      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFFMPEG_ROOT="C:\ffmpeg\$env:FFMPEG_ZIP"
          cmake --build build
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build\Fulskrin.exe, build\*.dll dist\
          Copy-Item -Recurse build\isf dist\isf
          windeployqt --release dist\Fulskrin.exe
          Compress-Archive -Path dist\* -DestinationPath Fulskrin-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Fulskrin-windows
          path: Fulskrin-windows.zip
